<!-- Default banner drawing (not used by a page yet): a browser window with a mini website, a performance score and the colour palette. Every colour comes from the site tokens via the .cs-ba-* classes in global.less, so the drawings follow the Change Colour button -->
<svg viewBox="0 0 520 440" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
    <!-- soft colour behind the window -->
    <circle class="cs-ba-accent-2 cs-ba-blob" cx="300" cy="200" r="170"/>

    <!-- browser window -->
    <rect class="cs-ba-shadow" x="52" y="66" width="408" height="296" rx="20"/>
    <rect class="cs-ba-surface cs-ba-stroke" x="44" y="54" width="408" height="296" rx="20"/>
    <path class="cs-ba-soft" d="M44 74a20 20 0 0 1 20-20h368a20 20 0 0 1 20 20v18H44z"/>
    <line class="cs-ba-stroke" x1="44" y1="92" x2="452" y2="92"/>
    <circle class="cs-ba-muted" cx="68" cy="73" r="5"/>
    <circle class="cs-ba-muted" cx="86" cy="73" r="5"/>
    <circle class="cs-ba-muted" cx="104" cy="73" r="5"/>
    <rect class="cs-ba-surface cs-ba-stroke" x="128" y="63" width="150" height="20" rx="10"/>
    <rect class="cs-ba-muted" x="140" y="70" width="80" height="6" rx="3"/>

    <!-- mini site: nav -->
    <rect class="cs-ba-dark" x="68" y="110" width="44" height="10" rx="5"/>
    <rect class="cs-ba-muted" x="300" y="112" width="30" height="6" rx="3"/>
    <rect class="cs-ba-muted" x="340" y="112" width="30" height="6" rx="3"/>
    <rect class="cs-ba-button" x="382" y="106" width="48" height="18" rx="9"/>

    <!-- mini site: hero -->
    <rect class="cs-ba-accent-1" x="68" y="138" width="362" height="104" rx="14"/>
    <rect class="cs-ba-dark" x="88" y="160" width="170" height="14" rx="7"/>
    <rect class="cs-ba-dark" x="88" y="182" width="120" height="14" rx="7"/>
    <rect class="cs-ba-text" x="88" y="206" width="150" height="6" rx="3"/>
    <rect class="cs-ba-button" x="88" y="220" width="66" height="14" rx="7"/>
    <!-- hero image: a little landscape -->
    <rect class="cs-ba-surface" x="290" y="152" width="122" height="76" rx="10"/>
    <circle class="cs-ba-accent-4 cs-ba-stroke" cx="384" cy="172" r="9"/>
    <path class="cs-ba-accent-3 cs-ba-stroke" d="M296 222l30-34 22 22 16-14 42 26z" stroke-linejoin="round"/>

    <!-- mini site: three cards -->
    <rect class="cs-ba-accent-3" x="68" y="256" width="112" height="72" rx="12"/>
    <rect class="cs-ba-accent-4" x="193" y="256" width="112" height="72" rx="12"/>
    <rect class="cs-ba-accent-2" x="318" y="256" width="112" height="72" rx="12"/>
    <rect class="cs-ba-dark" x="82" y="272" width="22" height="22" rx="7"/>
    <rect class="cs-ba-dark" x="207" y="272" width="22" height="22" rx="7"/>
    <rect class="cs-ba-dark" x="332" y="272" width="22" height="22" rx="7"/>
    <rect class="cs-ba-text" x="82" y="304" width="70" height="6" rx="3"/>
    <rect class="cs-ba-text" x="207" y="304" width="70" height="6" rx="3"/>
    <rect class="cs-ba-text" x="332" y="304" width="70" height="6" rx="3"/>
    <rect class="cs-ba-text" x="82" y="315" width="48" height="5" rx="2.5"/>
    <rect class="cs-ba-text" x="207" y="315" width="48" height="5" rx="2.5"/>
    <rect class="cs-ba-text" x="332" y="315" width="48" height="5" rx="2.5"/>

    <!-- floating card: performance score -->
    <g class="cs-ba-float cs-ba-float-1">
        <rect class="cs-ba-shadow" x="6" y="300" width="150" height="104" rx="18"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="0" y="292" width="150" height="104" rx="18"/>
        <circle class="cs-ba-ring-track" cx="46" cy="344" r="24"/>
        <circle class="cs-ba-ring" cx="46" cy="344" r="24" pathLength="100" transform="rotate(-90 46 344)"/>
        <text class="cs-ba-label cs-ba-label-big" x="46" y="349" text-anchor="middle">100</text>
        <rect class="cs-ba-dark" x="82" y="330" width="52" height="8" rx="4"/>
        <rect class="cs-ba-text" x="82" y="346" width="40" height="6" rx="3"/>
        <rect class="cs-ba-text" x="82" y="358" width="30" height="6" rx="3"/>
    </g>

    <!-- floating card: colour palette -->
    <g class="cs-ba-float cs-ba-float-2">
        <rect class="cs-ba-shadow" x="384" y="22" width="132" height="62" rx="16"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="378" y="14" width="132" height="62" rx="16"/>
        <circle class="cs-ba-accent-1 cs-ba-stroke" cx="404" cy="45" r="12"/>
        <circle class="cs-ba-accent-2 cs-ba-stroke" cx="432" cy="45" r="12"/>
        <circle class="cs-ba-accent-3 cs-ba-stroke" cx="460" cy="45" r="12"/>
        <circle class="cs-ba-accent-4 cs-ba-stroke" cx="488" cy="45" r="12"/>
    </g>

    <!-- cursor on the hero button -->
    <g class="cs-ba-float cs-ba-float-3">
        <path class="cs-ba-cursor" d="M140 226l20 13-9 2-4 9z" stroke-linejoin="round"/>
    </g>
</svg>
