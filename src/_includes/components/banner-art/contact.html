<!-- Contact: a chat conversation, with an envelope card and a typing bubble -->
<svg viewBox="0 0 520 440" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <!-- soft colour behind the window -->
        <circle class="cs-ba-accent-3 cs-ba-blob" cx="300" cy="200" r="170"/>

        <!-- browser window -->
        <rect class="cs-ba-shadow" x="52" y="66" width="408" height="296" rx="20"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="44" y="54" width="408" height="296" rx="20"/>
        <path class="cs-ba-soft" d="M44 74a20 20 0 0 1 20-20h368a20 20 0 0 1 20 20v18H44z"/>
        <line class="cs-ba-stroke" x1="44" y1="92" x2="452" y2="92"/>
        <circle class="cs-ba-muted" cx="68" cy="73" r="5"/>
        <circle class="cs-ba-muted" cx="86" cy="73" r="5"/>
        <circle class="cs-ba-muted" cx="104" cy="73" r="5"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="128" y="63" width="150" height="20" rx="10"/>
        <rect class="cs-ba-muted" x="140" y="70" width="80" height="6" rx="3"/>

        <!-- chat header -->
        <circle class="cs-ba-accent-1 cs-ba-stroke" cx="80" cy="118" r="14"/>
        <rect class="cs-ba-dark" x="102" y="110" width="80" height="8" rx="4"/>
        <circle class="cs-ba-success" cx="108" cy="128" r="4"/>
        <rect class="cs-ba-text" x="118" y="125" width="44" height="6" rx="3"/>
        <line class="cs-ba-stroke" x1="44" y1="146" x2="452" y2="146"/>

        <!-- messages -->
        <path class="cs-ba-accent-3" d="M82 160h162a14 14 0 0 1 14 14v12a14 14 0 0 1-14 14H74a6 6 0 0 1-6-6v-20a14 14 0 0 1 14-14z"/>
        <rect class="cs-ba-text" x="84" y="171" width="150" height="6" rx="3"/>
        <rect class="cs-ba-text" x="84" y="183" width="96" height="6" rx="3"/>
        <path class="cs-ba-button" d="M250 210h166a14 14 0 0 1 14 14v20a6 6 0 0 1-6 6H250a14 14 0 0 1-14-14v-12a14 14 0 0 1 14-14z"/>
        <rect class="cs-ba-on-button" x="252" y="221" width="150" height="6" rx="3"/>
        <rect class="cs-ba-on-button" x="252" y="233" width="92" height="6" rx="3"/>
        <path class="cs-ba-accent-1" d="M82 262h102a14 14 0 0 1 14 14v4a14 14 0 0 1-14 14H74a6 6 0 0 1-6-6v-12a14 14 0 0 1 14-14z"/>
        <rect class="cs-ba-text" x="84" y="275" width="90" height="6" rx="3"/>

        <!-- message field and send button -->
        <rect class="cs-ba-surface cs-ba-stroke" x="64" y="306" width="318" height="30" rx="15"/>
        <rect class="cs-ba-muted" x="80" y="318" width="120" height="6" rx="3"/>
        <circle class="cs-ba-button" cx="410" cy="321" r="16"/>
        <path class="cs-ba-on-button" d="M402 321l16-8-6 16-3-6z" stroke-linejoin="round"/>

        <!-- floating card: an email -->
        <g class="cs-ba-float cs-ba-float-1">
            <rect class="cs-ba-shadow" x="6" y="308" width="156" height="92" rx="18"/>
            <rect class="cs-ba-surface cs-ba-stroke" x="0" y="300" width="156" height="92" rx="18"/>
            <rect class="cs-ba-accent-4 cs-ba-stroke" x="18" y="326" width="52" height="38" rx="7"/>
            <path class="cs-ba-line" d="M20 330l25 18 25-18"/>
            <rect class="cs-ba-dark" x="84" y="330" width="52" height="8" rx="4"/>
            <rect class="cs-ba-text" x="84" y="346" width="40" height="6" rx="3"/>
            <rect class="cs-ba-text" x="84" y="358" width="30" height="6" rx="3"/>
        </g>

        <!-- floating card: someone is typing -->
        <g class="cs-ba-float cs-ba-float-2">
            <rect class="cs-ba-shadow" x="394" y="28" width="112" height="50" rx="25"/>
            <rect class="cs-ba-surface cs-ba-stroke" x="388" y="20" width="112" height="50" rx="25"/>
            <circle class="cs-ba-dark" cx="420" cy="45" r="5"/>
            <circle class="cs-ba-text" cx="444" cy="45" r="5"/>
            <circle class="cs-ba-muted" cx="468" cy="45" r="5"/>
        </g>
</svg>
