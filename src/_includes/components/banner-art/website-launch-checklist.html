<!-- Website launch checklist: a checklist card with ticked items, a progress ring and a rocket taking off -->
<svg viewBox="0 0 520 440" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
    <!-- soft colour behind the checklist -->
    <circle class="cs-ba-accent-2 cs-ba-blob" cx="270" cy="220" r="170"/>

    <!-- the checklist -->
    <rect class="cs-ba-shadow" x="108" y="70" width="270" height="320" rx="22"/>
    <rect class="cs-ba-surface cs-ba-stroke" x="100" y="60" width="270" height="320" rx="22"/>
    <rect class="cs-ba-dark" x="126" y="88" width="150" height="12" rx="6"/>
    <rect class="cs-ba-text" x="126" y="108" width="100" height="6" rx="3"/>
    <!-- progress bar -->
    <rect class="cs-ba-soft cs-ba-stroke" x="126" y="128" width="218" height="10" rx="5"/>
    <rect class="cs-ba-button" x="126" y="128" width="150" height="10" rx="5"/>

    <!-- checks: three done, two to go -->
    <rect class="cs-ba-accent-4" x="118" y="154" width="234" height="38" rx="10"/>
    <rect class="cs-ba-button" x="128" y="163" width="20" height="20" rx="6"/>
    <path class="cs-ba-line-light cs-ba-line-small" d="M133 173l4 4 7-8"/>
    <rect class="cs-ba-dark" x="160" y="169" width="120" height="8" rx="4"/>

    <rect class="cs-ba-accent-4" x="118" y="198" width="234" height="38" rx="10"/>
    <rect class="cs-ba-button" x="128" y="207" width="20" height="20" rx="6"/>
    <path class="cs-ba-line-light cs-ba-line-small" d="M133 217l4 4 7-8"/>
    <rect class="cs-ba-dark" x="160" y="213" width="96" height="8" rx="4"/>

    <rect class="cs-ba-accent-4" x="118" y="242" width="234" height="38" rx="10"/>
    <rect class="cs-ba-button" x="128" y="251" width="20" height="20" rx="6"/>
    <path class="cs-ba-line-light cs-ba-line-small" d="M133 261l4 4 7-8"/>
    <rect class="cs-ba-dark" x="160" y="257" width="130" height="8" rx="4"/>

    <rect class="cs-ba-soft cs-ba-stroke" x="118" y="286" width="234" height="38" rx="10"/>
    <rect class="cs-ba-surface cs-ba-stroke-strong" x="128" y="295" width="20" height="20" rx="6"/>
    <rect class="cs-ba-text" x="160" y="301" width="110" height="8" rx="4"/>

    <rect class="cs-ba-soft cs-ba-stroke" x="118" y="330" width="234" height="38" rx="10"/>
    <rect class="cs-ba-surface cs-ba-stroke-strong" x="128" y="339" width="20" height="20" rx="6"/>
    <rect class="cs-ba-text" x="160" y="345" width="84" height="8" rx="4"/>

    <!-- floating card: progress ring -->
    <g class="cs-ba-float cs-ba-float-1">
        <rect class="cs-ba-shadow" x="22" y="300" width="112" height="112" rx="24"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="16" y="292" width="112" height="112" rx="24"/>
        <circle class="cs-ba-ring-track" cx="72" cy="348" r="32"/>
        <circle class="cs-ba-ring" cx="72" cy="348" r="32" pathLength="100" transform="rotate(-90 72 348)" style="stroke-dasharray: 60 100"/>
        <text class="cs-ba-label cs-ba-label-mid" x="72" y="354" text-anchor="middle">60%</text>
    </g>

    <!-- floating: a rocket taking off -->
    <g class="cs-ba-float cs-ba-float-2">
        <circle class="cs-ba-surface cs-ba-stroke" cx="430" cy="110" r="70"/>
        <g transform="rotate(45 430 110)">
            <!-- flame -->
            <path class="cs-ba-accent-4 cs-ba-stroke-strong" d="M420 150c0 14 10 26 10 26s10-12 10-26z" stroke-linejoin="round"/>
            <!-- fins -->
            <path class="cs-ba-accent-1 cs-ba-stroke-strong" d="M412 118l-14 20 16-4zM448 118l14 20-16-4z" stroke-linejoin="round"/>
            <!-- body -->
            <path class="cs-ba-surface cs-ba-stroke-strong" d="M430 58c-14 14-20 34-20 56v34h40v-34c0-22-6-42-20-56z" stroke-linejoin="round"/>
            <circle class="cs-ba-button" cx="430" cy="102" r="9"/>
            <rect class="cs-ba-accent-2" x="414" y="138" width="32" height="8" rx="2"/>
        </g>
    </g>
</svg>
