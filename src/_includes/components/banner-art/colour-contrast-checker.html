<!-- Colour contrast checker: two colour samples with their ratio, AA / AAA passes, a dial and a picked colour -->
<svg viewBox="0 0 520 440" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <!-- soft colour behind the window -->
        <circle class="cs-ba-accent-4 cs-ba-blob" cx="300" cy="200" r="170"/>

        <!-- browser window -->
        <rect class="cs-ba-shadow" x="52" y="66" width="408" height="296" rx="20"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="44" y="54" width="408" height="296" rx="20"/>
        <path class="cs-ba-soft" d="M44 74a20 20 0 0 1 20-20h368a20 20 0 0 1 20 20v18H44z"/>
        <line class="cs-ba-stroke" x1="44" y1="92" x2="452" y2="92"/>
        <circle class="cs-ba-muted" cx="68" cy="73" r="5"/>
        <circle class="cs-ba-muted" cx="86" cy="73" r="5"/>
        <circle class="cs-ba-muted" cx="104" cy="73" r="5"/>
        <rect class="cs-ba-surface cs-ba-stroke" x="128" y="63" width="150" height="20" rx="10"/>
        <rect class="cs-ba-muted" x="140" y="70" width="80" height="6" rx="3"/>

        <!-- two samples: light on dark, dark on light -->
        <rect class="cs-ba-dark" x="68" y="108" width="170" height="150" rx="14"/>
        <text class="cs-ba-sample cs-ba-sample-light" x="153" y="202" text-anchor="middle">Aa</text>
        <rect class="cs-ba-accent-4 cs-ba-stroke" x="260" y="108" width="170" height="150" rx="14"/>
        <text class="cs-ba-sample cs-ba-sample-dark" x="345" y="202" text-anchor="middle">Aa</text>

        <!-- ratio and passes -->
        <text class="cs-ba-label cs-ba-label-ratio" x="68" y="304">19.8:1</text>
        <rect class="cs-ba-surface cs-ba-stroke" x="270" y="282" width="72" height="28" rx="14"/>
        <circle class="cs-ba-success" cx="286" cy="296" r="8"/>
        <path class="cs-ba-line-light cs-ba-line-small" d="M282 296l3 3 5-6"/>
        <text class="cs-ba-label cs-ba-label-small" x="300" y="300">AA</text>
        <rect class="cs-ba-surface cs-ba-stroke" x="350" y="282" width="80" height="28" rx="14"/>
        <circle class="cs-ba-success" cx="366" cy="296" r="8"/>
        <path class="cs-ba-line-light cs-ba-line-small" d="M362 296l3 3 5-6"/>
        <text class="cs-ba-label cs-ba-label-small" x="380" y="300">AAA</text>
        <rect class="cs-ba-text" x="68" y="322" width="190" height="6" rx="3"/>

        <!-- floating card: contrast dial -->
        <g class="cs-ba-float cs-ba-float-2">
            <rect class="cs-ba-shadow" x="398" y="24" width="112" height="112" rx="24"/>
            <rect class="cs-ba-surface cs-ba-stroke" x="392" y="16" width="112" height="112" rx="24"/>
            <circle class="cs-ba-ring-track" cx="448" cy="72" r="32"/>
            <circle class="cs-ba-ring" cx="448" cy="72" r="32" pathLength="100" transform="rotate(-90 448 72)" style="stroke-dasharray: 78 100"/>
            <text class="cs-ba-label cs-ba-label-mid" x="448" y="78" text-anchor="middle">AA</text>
        </g>

        <!-- floating card: a picked colour -->
        <g class="cs-ba-float cs-ba-float-1">
            <rect class="cs-ba-shadow" x="6" y="318" width="150" height="68" rx="18"/>
            <rect class="cs-ba-surface cs-ba-stroke" x="0" y="310" width="150" height="68" rx="18"/>
            <circle class="cs-ba-accent-1 cs-ba-stroke-strong" cx="36" cy="344" r="16"/>
            <rect class="cs-ba-dark" x="62" y="334" width="66" height="8" rx="4"/>
            <rect class="cs-ba-text" x="62" y="350" width="44" height="6" rx="3"/>
        </g>
</svg>
