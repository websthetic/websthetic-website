<!-- ============================================ -->
<!--                 Navigation                   -->
<!-- ============================================ -->

<!-- Transparent over the hero/banner, gets the .cs-scrolled class (dark glass background) once the page is scrolled - see nav.js -->
<header id="cs-navigation">
    <div class="cs-container">
        <!--Nav Logo-->
        <a href="/" class="cs-logo" aria-label="Websthetic home page">
            <svg viewBox="0 0 160.89 32" preserveAspectRatio="xMinYMid meet" width="161" height="32" aria-hidden="true" focusable="false"><use href="/assets/svgs/logo.svg#logo"/></svg>
        </a>
        <!--Navigation List-->
        <nav class="cs-nav" aria-label="main navigation">
            <!--Mobile Nav Toggle-->
            <button class="cs-toggle" id="cs-toggle" aria-expanded="false" aria-controls="cs-ul-wrapper" aria-label="mobile menu toggle" aria-haspopup="menu">
                <span class="cs-box" aria-hidden="true">
                    <span class="cs-line cs-line1" aria-hidden="true"></span>
                    <span class="cs-line cs-line2" aria-hidden="true"></span>
                    <span class="cs-line cs-line3" aria-hidden="true"></span>
                </span>
            </button>
            <!-- On mobile this wrapper becomes the full screen menu. On desktop it's just the inline list of links -->
            <div class="cs-ul-wrapper" id="cs-ul-wrapper">
                <ul id="cs-expanded" class="cs-ul">
                    <li class="cs-li">
                        <a href="/work/" class="cs-li-link {% if page.url == "/work/" %} cs-active {% endif %}" {% if page.url == "/work/" %} aria-current="page" {% endif %}>
                            Work
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/agencies/" class="cs-li-link {% if page.url == "/agencies/" %} cs-active {% endif %}" {% if page.url == "/agencies/" %} aria-current="page" {% endif %}>
                            For Agencies
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/small-business-websites/" class="cs-li-link {% if page.url == "/small-business-websites/" %} cs-active {% endif %}" {% if page.url == "/small-business-websites/" %} aria-current="page" {% endif %}>
                            Small Businesses
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/resources/" class="cs-li-link {% if page.url == "/resources/" %} cs-active {% endif %}" {% if page.url == "/resources/" %} aria-current="page" {% endif %}>
                            Resources
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/about/" class="cs-li-link {% if page.url == "/about/" %} cs-active {% endif %}" {% if page.url == "/about/" %} aria-current="page" {% endif %}>
                            About
                        </a>
                    </li>
                    <!-- CTA inside the mobile menu, the desktop CTA is the .cs-nav-button below -->
                    <li class="cs-li cs-li-cta cs-hide-on-desktop">
                        <a href="/contact/" class="cs-button-solid">Start a Project</a>
                    </li>
                </ul>
            </div>
        </nav>
        <a href="/contact/" class="cs-button-solid cs-nav-button">Start a Project</a>
    </div>
</header>
